name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Preserve the existing required-check name for branch protection.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Disposable CI identity for tests that create fixture commits.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' -c constraints.txt -c constraints-test.txt

      - name: Select and run validation gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/ci-validation
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          else
            base=$(git rev-parse HEAD)
          fi
          python scripts/ci_validation.py run --base "$base" --output "$EVIDENCE_DIR"

      - name: Preserve selection, source audit, commands and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-validation
          if-no-files-found: warn

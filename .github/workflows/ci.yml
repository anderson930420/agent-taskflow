name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tests run real git rebase/merge, which create commits and need an
      # identity. The VPS has a global identity; the CI runner has none.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - name: Install package and dependencies
        run: python -m pip install -e . -c constraints.txt

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests

      - name: Compile sources
        run: PYTHONPATH=. python -m compileall agent_taskflow scripts tests

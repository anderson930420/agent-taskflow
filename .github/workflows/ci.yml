name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: python -m pip install -e . -c constraints.txt

      - name: Compile sources
        run: PYTHONPATH=. python -m compileall -q agent_taskflow scripts tests

      # The Ticket path's entrypoints must still import. The full test suite
      # stays in tests/ and runs locally on demand (`python -m pytest tests -n 4`).
      - name: Import the Ticket path entrypoints
        run: |
          PYTHONPATH=. python -c "import agent_taskflow, agent_taskflow.scheduler_worker, agent_taskflow.api.main, agent_taskflow.integration_tick"
          PYTHONPATH=. python scripts/run_parallel_scheduler_tick.py --help > /dev/null
          PYTHONPATH=. python scripts/run_integration_tick.py --help > /dev/null
          PYTHONPATH=. python scripts/run_api.py --help > /dev/null

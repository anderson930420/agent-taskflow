# Agent Taskflow — Project Registry
#
# Configure each repository that Agent Taskflow manages.
# Scripts load this via --config (default: config/projects.yaml).
#
# Schema:
#   project_slug:   Unique identifier for this project (used with --project)
#   task_key_prefix: Prefix for task keys (e.g. AT, BJ)
#   repo_path:       Absolute path to the git repository
#   github_repo:     GitHub owner/repo (e.g. owner/repo)
#   artifacts_root:  Where task artifacts are stored
#   worktrees_dir:   Where git worktrees are created
#   default_branch:  Main branch name (default: main)
#   branch_prefix:   Prefix for worktree branches (default: worktree/)
#   execution:       The project's V1 execution policy (RULINGS 67). It is the
#                    only repo-level source of how a V1 Ticket runs, and no CLI,
#                    API or legacy runner may override it. A project WITHOUT a
#                    valid execution: block is NOT runnable: its Tickets are
#                    never claimed (agent_taskflow/execution_policy.py). Every
#                    key below is required and no other key is accepted; bump
#                    policy_version whenever anything in the block changes.
#                    Never put a token, credential or environment value here.
#
# No project has an execution: block yet. Model, effort and auth are pending
# the owner's separate-UID auth test, so nothing is runnable (the safe default).
# Commented example, with placeholder values:
#
#   execution:
#     executor: claude-code        # the only allowed executor (not manual/noop/shell)
#     argv: [claude, --print, --model, "{model}", --effort, "{effort}"]
#     model: <model id>            # substituted for {model}; must appear once
#     effort: <effort level>       # substituted for {effort}; must appear once
#     timeout_seconds: 3600        # executor wall clock, 1..86400; required
#     permission_profile: <profile id>
#     policy_version: "<version>"  # a quoted string
#     implementation_validators:   # run by the dispatcher; registry names only
#       - {name: pytest, timeout_seconds: 1800}
#     integration_validators:      # run by the integration tick
#       - {name: pytest, command: [python, -m, pytest, -q], timeout_seconds: 1800}

projects:
  agent-taskflow:
    project_slug: agent-taskflow
    task_key_prefix: AT
    repo_path: /home/ubuntu/agent-taskflow
    github_repo: anderson930420/agent-taskflow
    artifacts_root: /home/ubuntu/.hermes/task-artifacts
    worktrees_dir: /home/ubuntu/agent-taskflow/.worktrees
    default_branch: main
    branch_prefix: task/
    hermes_board: agent-taskflow

  bullet_journal:
    project_slug: bullet_journal
    task_key_prefix: BJ
    repo_path: /home/ubuntu/bullet_journal_app
    github_repo: anderson930420/bullet_journal_app
    artifacts_root: /home/ubuntu/.hermes/task-artifacts
    worktrees_dir: /home/ubuntu/bullet_journal_app/.worktrees
    default_branch: main
    branch_prefix: worktree/
    hermes_board: bullet-journal
